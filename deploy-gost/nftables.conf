#!/usr/sbin/nft -f
# ==============================================================================
# Linux nftables Firewall Configuration for Proxy Router (Stealth Whitelist)
# ==============================================================================

table inet proxy_filter {
    # In-memory kernel set of authorized IPv4 client addresses
    set whitelist {
        type ipv4_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy accept;

        # Allow established and related connections (fast path)
        ct state established,related accept

        # Allow localhost
        iifname "lo" accept

        # Protect proxy ports: 3128 (HTTP), 8443 (HTTPS/TLS), 1080 (SOCKS5)
        # 1. If client IP is in whitelist -> ACCEPT immediately in kernel space
        tcp dport { 3128, 8443, 1080 } ip saddr @whitelist accept

        # 2. If client IP is NOT in whitelist -> DROP silently (Stealth mode)
        # Port scanners (Shodan, Censys) see ports as completely filtered / offline
        tcp dport { 3128, 8443, 1080 } drop
    }
}
