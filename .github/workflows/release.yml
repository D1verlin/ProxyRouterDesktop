name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './proxy-router-desktop/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './proxy-router-desktop/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ./proxy-router-desktop
        run: npm ci

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './proxy-router-desktop'
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Proxy Router Desktop v__VERSION__'
          releaseBody: |
            ## Proxy Router Desktop ${{ github.event.inputs.tag || github.ref_name }}
            
            Автоматическая официальная сборка для Windows (x64).
            
            ### Доступные инсталляторы и бинарники:
            - **NSIS Setup (.exe)** — Стандартный инсталлятор Windows с автоматическим мастером установки.
            - **MSI Installer (.msi)** — Корпоративный пакет Windows Installer для тихой и контролируемой установки.
            
            ### Контрольные суммы и целостность:
            Все артефакты компилируются напрямую из исходного кода в изолированной среде GitHub Actions.
          releaseDraft: false
          prerelease: false

      - name: Prepare Portable Executable
        shell: powershell
        run: |
          $bin = "./proxy-router-desktop/src-tauri/target/release/proxy-router-desktop.exe"
          if (Test-Path $bin) {
            Copy-Item $bin "./Proxy.Router.Desktop_portable.exe"
          }

      - name: Upload Portable Executable
        uses: softprops/action-gh-release@v2
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            Proxy.Router.Desktop_portable.exe
