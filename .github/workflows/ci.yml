name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'proxy-router-desktop/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'proxy-router-desktop/**'

jobs:
  check-build:
    name: Verify Frontend & Rust
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './proxy-router-desktop/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './proxy-router-desktop/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ./proxy-router-desktop
        run: npm ci

      - name: Build frontend
        working-directory: ./proxy-router-desktop
        run: npm run build

      - name: Cargo check
        working-directory: ./proxy-router-desktop/src-tauri
        run: cargo check
